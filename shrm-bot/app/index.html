<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ШРМ — меню</title>
<meta name="robots" content="noindex, nofollow">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bordo:#6C151E; --bordo-dd:#3E0A10; --cream:#F5DABF; --paper:#FBEBDA; --tint:#F0C7A2;
  --line:#EBCBAA; --muted:#8A4A4F; --ink:#3E0A10;
  --display:"Dela Gothic One", system-ui, sans-serif; --body:"Golos Text", system-ui, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--body);background:var(--cream);color:var(--ink);font-size:16px;line-height:1.4;padding-bottom:96px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:3px solid var(--bordo);outline-offset:2px;border-radius:8px}
.hidden{display:none!important}

header{background:var(--bordo);color:var(--cream);padding:16px 16px 18px}
header .row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
header h1{font-family:var(--display);font-weight:400;font-size:28px;letter-spacing:.01em}
header .open{font-size:13px;color:#F0C9A6}
header p{font-size:14px;color:#F0D3B8;margin-top:4px}

.cats{position:sticky;top:0;z-index:5;display:flex;gap:8px;overflow-x:auto;padding:10px 16px;background:var(--cream);border-bottom:1px solid rgba(108,21,30,.12);scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;font-weight:600;font-size:15px;padding:8px 14px;border-radius:999px;background:var(--paper);border:1px solid rgba(108,21,30,.18)}
.cats button.on{background:var(--bordo);color:var(--cream);border-color:var(--bordo)}

.sec{padding:18px 16px 4px;scroll-margin-top:58px}
.sec h2{font-family:var(--display);font-weight:400;font-size:21px;margin-bottom:12px}
.list{display:grid;gap:10px}

.card{background:var(--paper);border-radius:16px;overflow:hidden;display:grid;grid-template-columns:104px 1fr}
.card.noimg{grid-template-columns:1fr}
.card.noimg .body{flex-direction:row;align-items:center;gap:12px}
.card.noimg h3{flex:1}
.card.noimg .buy{margin:0;gap:12px}
.card .pic{background:var(--tint)}
.card .pic img{width:100%;height:100%;object-fit:cover;display:block}
.card .body{padding:12px 12px 12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card h3{font-size:16px;font-weight:700;line-height:1.25}
.card .w{font-size:13px;color:var(--muted);font-weight:500;margin-left:4px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:3px;background:#F1D2B4;border-radius:999px}
.seg button{font-size:13px;font-weight:600;color:var(--muted);padding:6px 4px;border-radius:999px}
.seg button.on{background:var(--bordo);color:var(--cream)}
.buy{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}
.price{font-family:var(--display);font-size:18px;white-space:nowrap}
.add{background:var(--bordo);color:var(--cream);font-weight:600;font-size:14px;padding:8px 16px;border-radius:999px;min-height:36px}
.step{display:flex;align-items:center;background:var(--bordo);color:var(--cream);border-radius:999px;min-height:36px}
.step button{width:36px;height:36px;font-size:20px;font-weight:600;line-height:1}
.step span{min-width:22px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}

.bar{position:fixed;left:12px;right:12px;bottom:12px;z-index:20}
.bar button{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--bordo);color:var(--cream);font-weight:600;font-size:17px;padding:16px 20px;border-radius:999px;box-shadow:0 10px 30px rgba(62,10,16,.3)}
.bar .sum{font-family:var(--display);font-weight:400}

/* Оформление */
#checkout{padding:0 16px}
.top{display:flex;align-items:center;gap:10px;padding:16px 0 6px}
.top h2{font-family:var(--display);font-weight:400;font-size:24px}
.back{font-size:15px;font-weight:600;color:var(--muted);padding:6px 0}
.box{background:var(--paper);border-radius:16px;padding:6px 14px;margin-top:12px}
.line{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.line:last-child{border-bottom:0}
.line .nm{flex:1;min-width:0;font-weight:600;font-size:15px}
.line .nm small{display:block;font-weight:500;color:var(--muted);font-size:13px}
.line .step{min-height:32px}
.line .step button{width:32px;height:32px;font-size:18px}
.line .s{font-family:var(--display);font-size:15px;white-space:nowrap;min-width:64px;text-align:right}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0 6px;font-weight:700}
.total b{font-family:var(--display);font-weight:400;font-size:22px}
label.f{display:block;margin-top:14px;font-weight:600;font-size:14px;color:var(--muted)}
.f input,.f select,.f textarea{display:block;width:100%;margin-top:6px;font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:12px 14px}
.f textarea{resize:none;height:72px}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--bordo)}
.seg.big{margin-top:6px}
.seg.big button{font-size:15px;padding:10px 4px}
.err{color:#B3261E;font-size:14px;font-weight:600;margin-top:12px;min-height:20px}
.pay{font-size:14px;color:var(--muted);margin-top:4px}

#done{padding:60px 24px;text-align:center}
#done h2{font-family:var(--display);font-weight:400;font-size:26px}
#done p{margin-top:10px;color:var(--muted)}
</style>
</head>
<body>

<div id="menuView">
  <header>
    <div class="row"><h1>ШРМ</h1><span class="open">Открыто 24/7</span></div>
    <p>Дзержинского, 2/2 · у ТЦ «Роща»</p>
  </header>
  <nav class="cats" id="cats"></nav>
  <main id="menu"></main>
</div>

<div id="checkout" class="hidden">
  <div class="top"><button class="back" id="back" type="button">← Меню</button></div>
  <div class="top" style="padding-top:0"><h2>Ваш заказ</h2></div>
  <div class="box" id="lines"></div>

  <label class="f">Как получить
    <div class="seg big" id="mode" role="group">
      <button type="button" class="on" data-v="pickup">С собой</button>
      <button type="button" data-v="here">Поем на месте</button>
    </div>
  </label>
  <label class="f">Когда
    <select id="time"></select>
  </label>
  <label class="f">Имя
    <input id="name" autocomplete="given-name" maxlength="40" placeholder="Как к вам обращаться">
  </label>
  <label class="f">Телефон
    <input id="phone" type="tel" autocomplete="tel" inputmode="tel" maxlength="18" placeholder="+7 900 000-00-00">
  </label>
  <label class="f">Комментарий
    <textarea id="comment" maxlength="200" placeholder="Например: без лука"></textarea>
  </label>
  <p class="pay">Оплата при получении.</p>
  <p class="err" id="err" role="alert"></p>
</div>

<div id="done" class="hidden">
  <h2>Заказ отправлен</h2>
  <p id="doneText">Подтверждение придёт в чат с ботом.</p>
</div>

<div class="bar hidden" id="bar"><button type="button" id="barBtn"><span id="barLabel">Корзина</span><span class="sum" id="barSum"></span></button></div>

<script>
(function(){
  var tg = window.Telegram && Telegram.WebApp;
  var inTelegram = !!(tg && tg.initData);
  if (tg) { try { tg.ready(); tg.expand(); tg.setHeaderColor('#6C151E'); tg.setBackgroundColor('#F5DABF'); } catch(e){} }
  var IMG = '../../shrm/img/';
  var MENU, cart = {}, sizeSel = {}, view = 'menu';

  function rub(n){ return n.toLocaleString('ru-RU').replace(/ /g,' ') + ' ₽'; }
  function el(tag, cls, html){ var e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
  function haptic(){ try{ tg && tg.HapticFeedback.impactOccurred('light'); }catch(e){} }
  function key(id,s){ return id+'|'+s; }
  function item(id){ return MENU.items.find(function(i){return i.id===id}); }
  function size(it,s){ return it.sizes.find(function(x){return x.id===s}); }
  function totals(){
    var sum=0,cnt=0;
    Object.keys(cart).forEach(function(k){ var p=k.split('|'), it=item(p[0]); sum+=size(it,p[1]).price*cart[k]; cnt+=cart[k]; });
    return {sum:sum,cnt:cnt};
  }
  function plural(n){ var a=n%10,b=n%100; return (a===1&&b!==11)?'позиция':(a>=2&&a<=4&&(b<12||b>14))?'позиции':'позиций'; }

  // ---------- Меню ----------
  function renderMenu(){
    var cats=document.getElementById('cats'), menu=document.getElementById('menu');
    MENU.categories.forEach(function(c,i){
      var b=el('button', i?'':'on', c.title); b.type='button'; b.dataset.id=c.id;
      b.onclick=function(){ document.getElementById('s-'+c.id).scrollIntoView({behavior:'smooth'}); setCat(c.id); };
      cats.appendChild(b);
      var sec=el('section','sec'); sec.id='s-'+c.id; sec.appendChild(el('h2','',c.title));
      var list=el('div','list');
      MENU.items.filter(function(i){return i.cat===c.id}).forEach(function(it){ list.appendChild(card(it)); });
      sec.appendChild(list); menu.appendChild(sec);
    });
    window.addEventListener('scroll', function(){
      var cur=MENU.categories[0].id;
      MENU.categories.forEach(function(c){ if(document.getElementById('s-'+c.id).getBoundingClientRect().top<=70) cur=c.id; });
      if(innerHeight+scrollY>=document.body.scrollHeight-4) cur=MENU.categories[MENU.categories.length-1].id;
      setCat(cur);
    },{passive:true});
  }
  function setCat(id){ [].forEach.call(document.querySelectorAll('#cats button'),function(b){b.classList.toggle('on',b.dataset.id===id)}); }

  function card(it){
    var c=el('article','card'+(it.img?'':' noimg'));
    if(it.img){ var pic=el('div','pic'); var im=el('img'); im.src=IMG+it.img+'.svg'; im.alt=''; im.loading='lazy'; pic.appendChild(im); c.appendChild(pic); }
    var body=el('div','body'); c.appendChild(body);
    sizeSel[it.id]=it.sizes[0].id;
    function draw(){
      var s=size(it,sizeSel[it.id]);
      body.innerHTML='';
      body.appendChild(el('h3','',it.title+(s.weight?'<span class="w">'+s.weight+'</span>':'')));
      if(it.sizes.length>1){
        var seg=el('div','seg');
        it.sizes.forEach(function(x){ var b=el('button',x.id===s.id?'on':'',x.title); b.type='button'; b.onclick=function(){ sizeSel[it.id]=x.id; draw(); }; seg.appendChild(b); });
        body.appendChild(seg);
      }
      var buy=el('div','buy'); buy.appendChild(el('span','price',rub(s.price)));
      var k=key(it.id,s.id), q=cart[k]||0;
      if(!q){ var add=el('button','add','Добавить'); add.type='button'; add.onclick=function(){ cart[k]=1; haptic(); draw(); update(); }; buy.appendChild(add); }
      else buy.appendChild(stepper(k,function(){ draw(); update(); }));
      body.appendChild(buy);
    }
    draw(); c._draw=draw; cardsById[it.id]=c;
    return c;
  }
  var cardsById={};
  function stepper(k,after){
    var st=el('div','step');
    var minus=el('button','','−'), n=el('span','',String(cart[k])), plus=el('button','','+');
    minus.type=plus.type='button'; minus.setAttribute('aria-label','Убрать одну'); plus.setAttribute('aria-label','Добавить ещё');
    minus.onclick=function(){ cart[k]--; if(cart[k]<=0) delete cart[k]; haptic(); after(); };
    plus.onclick=function(){ if(cart[k]<20) cart[k]++; haptic(); after(); };
    st.appendChild(minus); st.appendChild(n); st.appendChild(plus); return st;
  }

  // ---------- Нижняя кнопка ----------
  function update(){
    var t=totals(), bar=document.getElementById('bar');
    if(view==='done' || !t.cnt){ bar.classList.add('hidden'); if(view==='checkout' && !t.cnt) show('menu'); return; }
    bar.classList.remove('hidden');
    document.getElementById('barLabel').textContent = view==='menu' ? 'Корзина · '+t.cnt+' '+plural(t.cnt) : 'Отправить заказ';
    document.getElementById('barSum').textContent = rub(t.sum);
  }
  document.getElementById('barBtn').onclick=function(){ view==='menu' ? show('checkout') : submit(); };

  function show(v){
    view=v;
    document.getElementById('menuView').classList.toggle('hidden', v!=='menu');
    document.getElementById('checkout').classList.toggle('hidden', v!=='checkout');
    document.getElementById('done').classList.toggle('hidden', v!=='done');
    if(v==='checkout') renderLines();
    if(v==='menu') Object.keys(cardsById).forEach(function(id){ cardsById[id]._draw(); });
    try{ if(tg){ v==='checkout' ? tg.BackButton.show() : tg.BackButton.hide(); } }catch(e){}
    scrollTo(0,0); update();
  }
  document.getElementById('back').onclick=function(){ show('menu'); };
  try{ tg && tg.BackButton.onClick(function(){ show('menu'); }); }catch(e){}

  // ---------- Оформление ----------
  function renderLines(){
    var box=document.getElementById('lines'); box.innerHTML='';
    Object.keys(cart).forEach(function(k){
      var p=k.split('|'), it=item(p[0]), s=size(it,p[1]);
      var row=el('div','line');
      row.appendChild(el('div','nm',it.title+(s.title?'<small>'+s.title+(s.weight?' · '+s.weight:'')+'</small>':(s.weight?'<small>'+s.weight+'</small>':''))));
      row.appendChild(stepper(k,function(){ renderLines(); update(); }));
      row.appendChild(el('div','s',rub(s.price*cart[k])));
      box.appendChild(row);
    });
    var t=totals(); box.appendChild(el('div','total','<span>Итого</span><b>'+rub(t.sum)+'</b>'));
  }
  var mode='pickup';
  [].forEach.call(document.querySelectorAll('#mode button'),function(b){ b.onclick=function(){ mode=b.dataset.v; [].forEach.call(document.querySelectorAll('#mode button'),function(x){x.classList.toggle('on',x===b)}); }; });

  function fillTimes(){
    var sel=document.getElementById('time'); sel.appendChild(new Option('Как можно скорее (~15 мин)','asap'));
    var now; try{ now=new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Novosibirsk'})); }catch(e){ now=new Date(); }
    var m=Math.ceil((now.getHours()*60+now.getMinutes()+30)/15)*15;
    for(var i=0;i<12;i++){ var t=(m+i*15)%1440, hh=String(Math.floor(t/60)).padStart(2,'0'), mm=String(t%60).padStart(2,'0'); sel.appendChild(new Option('К '+hh+':'+mm, hh+':'+mm)); }
  }
  try{ var u=tg.initDataUnsafe.user; if(u&&u.first_name) document.getElementById('name').value=u.first_name; }catch(e){}

  function submit(){
    var err=document.getElementById('err'); err.textContent='';
    var name=document.getElementById('name').value.trim(), phone=document.getElementById('phone').value.trim();
    if(!name){ err.textContent='Укажите имя'; return; }
    if(phone.replace(/\D/g,'').length<10){ err.textContent='Укажите телефон, чтобы мы могли связаться'; return; }
    var order={v:1, items:Object.keys(cart).map(function(k){ var p=k.split('|'); return [p[0],p[1],cart[k]]; }),
      mode:mode, time:document.getElementById('time').value, name:name, phone:phone, comment:document.getElementById('comment').value.trim()};
    if(inTelegram){
      try{ tg.sendData(JSON.stringify(order)); return; }
      catch(e){ err.textContent='Откройте меню кнопкой «Открыть меню» внизу чата с ботом'; return; }
    }
    cart={}; show('done');
    document.getElementById('doneText').textContent='Это превью в браузере. В Telegram заказ ушёл бы в чат с ботом, а владелец получил бы карточку заказа.';
  }

  ['name','phone'].forEach(function(id){ document.getElementById(id).addEventListener('input',function(){ document.getElementById('err').textContent=''; }); });
  fetch('menu.json').then(function(r){return r.json()}).then(function(m){ MENU=m; renderMenu(); fillTimes(); update(); });
})();
</script>
</body>
</html>
