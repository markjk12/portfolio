<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ШРМ — меню</title>
<meta name="robots" content="noindex, nofollow">
<style>html,body{margin:0;background:#F5DABF}</style>
</head>
<body>
<script>
// Входная страница меню. Она не меняется, поэтому неважно, что Telegram её запоминает:
// при каждом открытии она скачивает свежую версию меню (app.html) в обход памяти.
(function(){
  var url = 'app.html?t=' + Date.now();
  fetch(url, {cache: 'no-store'})
    .then(function(r){ if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function(html){ document.open(); document.write(html); document.close(); })
    .catch(function(){ location.replace(url + location.hash); });
})();
</script>
</body>
</html>
